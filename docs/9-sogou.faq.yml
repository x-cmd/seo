id: x-seo-9-sogou

data:
  - name:
      en: overview
      cn: 概览
    qa:
      - id: what-is-sogou
        question:
          en: What is Sogou?
          cn: 什么是搜狗？
        answer:
          en: A Tencent-backed Chinese search engine (搜狗). Deep integration with WeChat 公众号 and QQ.com. Operates Sogou Search Console at zhanzhang.sogou.com.
          cn: 腾讯系中文搜索引擎。与微信公众号、QQ.com 深度集成。运营搜狗站长平台（zhanzhang.sogou.com）。
        confidence: 9
        reference:
          - docs/9-sogou.en.md
          - docs/9-sogou.cn.md

      - id: sogou-vs-baidu
        question:
          en: How is Sogou SEO different from Baidu SEO?
          cn: 搜狗 SEO 与百度 SEO 有何不同？
        answer:
          en: Both recommend ICP for mainland-China hosting and both favor Simplified Chinese content. Sogou additionally weights WeChat 公众号 + QQ.com presence heavily; Baidu weights its own Tieba / Baike / Zhidao ecosystem.
          cn: 两者都推荐大陆主机办理 ICP、都偏好简体中文内容。搜狗额外看重微信公众号 + QQ.com 存在；百度看重自家贴吧 / 百科 / 知道生态。
        confidence: 8
        reference:
          - docs/9-sogou.en.md

  - name:
      en: ecosystem
      cn: 生态
    qa:
      - id: wechat-integration
        question:
          en: How does Sogou integrate with WeChat?
          cn: 搜狗如何与微信集成？
        answer:
          en: Sogou directly indexes WeChat 公众号 (official accounts) articles. Posts from active 公众号 can rank on Sogou even without a traditional website backlink profile — the strongest Sogou-unique ranking signal.
          cn: 搜狗直接收录微信公众号文章。活跃公众号的文章可以在搜狗上排名，无需传统网站的反向链接档案 —— 搜狗最强且独有的排名信号。
        confidence: 9
        reference:
          - docs/9-sogou.en.md

      - id: sogou-input-role
        question:
          en: What is Sogou Input's role in SEO?
          cn: 搜狗输入法在 SEO 中起什么作用？
        answer:
          en: Sogou Input (搜狗输入法) is the most popular Chinese IME on desktop and mobile. Its query stream feeds Sogou Search and surfaces trending Chinese-language search terms — a unique input-source signal vs Baidu.
          cn: 搜狗输入法是中英文输入法中最流行的。其查询流为搜狗搜索提供中文搜索热词数据 —— 相比百度独有的输入端信号。
        confidence: 8
        reference:
          - docs/9-sogou.en.md

  - name:
      en: submission
      cn: 提交
    qa:
      - id: sogou-webmaster
        question:
          en: What is Sogou Search Console?
          cn: 什么是搜狗站长平台？
        answer:
          en: Sogou's free webmaster tool at zhanzhang.sogou.com — verify site, submit sitemaps, submit individual URLs, monitor indexing.
          cn: 搜狗的免费站长工具 —— 验证站点、提交 sitemap、提交单个 URL、监控收录。
        confidence: 9
        reference:
          - docs/9-sogou.en.md

      - id: icp-needed-sogou
        question:
          en: Do I need ICP filing for Sogou?
          cn: 搜狗需要 ICP 备案吗？
        answer:
          en: For mainland-China hosting, ICP filing is recommended (same as Baidu). Sites on overseas servers don't need ICP; Sogou still indexes them.
          cn: 大陆主机推荐办理 ICP 备案（同百度）。海外服务器不需要；搜狗仍会收录。
        confidence: 9
        reference:
          - docs/9-sogou.en.md