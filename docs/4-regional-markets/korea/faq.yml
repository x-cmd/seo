id: x-seo-korea

data:
  - name:
      en: overview
      cn: 概览
    qa:
      - id: korea-market-share
        question:
          en: What is South Korea's search engine market share?
          cn: 韩国搜索引擎的市场份额是多少？
        answer:
          en: |
            It depends on what you count, and the two credible trackers
            disagree by 17 points on the same market in the same year.

            **Query volume (InternetTrend, 2025):** Naver 62.9%, Google
            29.6%, Bing 3.1%, Daum 2.9%.

            **Outbound referrals (StatCounter, 2025):** Google 45.8%,
            Naver 45.6%, Bing 5.0%, Daum 1.2%, CocCoc 0.9%.

            InternetTrend counts every search typed; StatCounter only
            counts clicks that leave the engine for a website. Naver
            answers many Korean questions on its own pages, so no click
            is recorded. Use the query figure to size the opportunity and
            the referral figure to size the traffic.
          cn: |
            取决于你数的是什么，两家可信的统计源在同一个市场、同一年上
            差 17 个百分点。

            **查询量（InternetTrend，2025）：** Naver 62.9%、Google 29.6%、
            Bing 3.1%、Daum 2.9%。

            **外跳引荐（StatCounter，2025）：** Google 45.8%、Naver 45.6%、
            Bing 5.0%、Daum 1.2%、CocCoc 0.9%。

            InternetTrend 数每一次敲下去的搜索；StatCounter 只数真正
            点出引擎落到网站的点击。Naver 把很多韩国问题答在自家页面上，
            所以没有点击被记录。要估机会大小用查询量，要估流量大小用
            引荐量。
        confidence: 9
        reference:
          - docs/4-regional-markets/korea/en.md
          - docs/4-regional-markets/korea/cn.md

      - id: korea-52-38-figure
        question:
          en: Is Google 52.4% and Naver 38.2% in Korea?
          cn: 韩国是 Google 52.4%、Naver 38.2% 吗？
        answer:
          en: |
            That pair circulates on blogs and aggregator sites, and it does
            not match either major tracker in either direction, for any
            device split. Treat it as unverified.

            For reference, the two credible 2025 readings are Naver 62.9%
            / Google 29.6% on query volume, and Google 45.8% / Naver 45.6%
            on referrals. If a share figure arrives without a source, a
            date and a measurement method, it is probably wrong.
          cn: |
            这一对数字在各种博客和聚合站上流传，但它跟两家主要统计源在
            任何方向、任何设备口径下都对不上。应当作未经证实处理。

            供参考，两个可信的 2025 读数是：查询量口径 Naver 62.9% /
            Google 29.6%；引荐口径 Google 45.8% / Naver 45.6%。一个不带
            来源、不带日期、不带口径的份额数字，通常是错的。
        confidence: 8
        reference:
          - docs/4-regional-markets/korea/en.md
          - docs/4-regional-markets/korea/cn.md

      - id: korea-mobile-vs-desktop
        question:
          en: Which search engine wins on mobile in Korea, and which on desktop?
          cn: 韩国移动端和桌面端分别是谁赢？
        answer:
          en: |
            Mobile: Naver 60.8%, Google 35.9% (2025 averages). Desktop:
            Google 58.6%, Naver 26.1%, Bing 10.8%, Daum 2.8%.

            So Naver is a mobile engine and Google is a desktop engine in
            Korea. Daum barely registers on mobile — it is a desktop
            portal that survives on old-PC habits. A Korean launch that
            optimizes only for Google is optimizing for the smaller half
            of the market.
          cn: |
            移动端：Naver 60.8%、Google 35.9%（2025 平均）。桌面端：
            Google 58.6%、Naver 26.1%、Bing 10.8%、Daum 2.8%。

            也就是说，在韩国 Naver 是移动引擎，Google 是桌面引擎。Daum
            在移动端几乎归零——它是靠老电脑用户习惯活下来的桌面门户。
            只优化 Google 的韩国上线方案，优化的是这个市场里较小的一半。
        confidence: 9
        reference:
          - docs/4-regional-markets/korea/en.md
          - docs/4-regional-markets/korea/cn.md

      - id: naver-ranking-signals
        question:
          en: How does Naver rank things, and what are C-Rank and D.I.A.?
          cn: Naver 怎么排序？C-Rank 和 D.I.A. 是什么？
        answer:
          en: |
            Naver assembles its result page from its own verticals rather
            than returning one list of links: VIEW (blog + cafe results),
            Knowledge iN Q&A, Naver Blog, Naver Cafe, Naver Place,
            Shopping and News.

            **C-Rank** scores a blog's authority and how focused it is on
            its topic. **D.I.A.** scores an individual piece of content —
            relevance, dwell time, comments and shares.

            Naver's own team calls the result a closed ecosystem
            (폐쇄형 생태계): much of this content cannot be crawled by
            Google at all, so being absent from those verticals is a
            permanent loss rather than a ranking penalty.
          cn: |
            Naver 的结果页不是一列链接，而是用它自己的垂类拼出来的：VIEW
            （博客 + Cafe 结果）、知识 iN 问答、Naver 博客、Naver Cafe、
            Naver Place、Shopping 和 News。

            **C-Rank** 给博客的权威度和话题专注度打分；**D.I.A.** 给单篇
            内容打分——相关性、停留时间、评论和分享。

            Naver 自己的团队把这称作 폐쇄형 생태계（封闭生态）：这里很大
            一部分内容 Google 根本爬不到，所以在这些垂类里缺席是永久性
            损失，而不是排名惩罚。
        confidence: 9
        reference:
          - docs/4-regional-markets/korea/en.md
          - docs/4-regional-markets/korea/cn.md

      - id: naver-search-advisor
        question:
          en: What is Naver Search Advisor, and does it replace Google Search Console?
          cn: Naver Search Advisor 是什么？能替代 Google Search Console 吗？
        answer:
          en: |
            It is Naver's webmaster tool — the closest thing Korea has to
            Google Search Console. It gives you ownership verification,
            crawl and index reports, URL-level inspection and reindex
            requests, plus a site-check tool and SEO basics.

            It does not replace Search Console: it governs only the
            external-web layer of Naver. It says nothing about whether
            your brand is present inside Naver's own products — Blog,
            Cafe, Place, Shopping — which is where a lot of Korean
            visibility actually lives.
          cn: |
            它是 Naver 的站长工具，是韩国最接近 Google Search Console 的
            东西：所有权验证、抓取与收录报告、URL 级检查、重新索引请求，
            外加站点检查和 SEO 基础。

            但它不能替代 Search Console：它只管 Naver 的外部网页这一层，
            完全不告诉你品牌是否出现在 Naver 自家的产品里——博客、Cafe、
            Place、Shopping，而韩国大量真实曝光恰恰在那里。
        confidence: 9
        reference:
          - docs/4-regional-markets/korea/en.md
          - docs/4-regional-markets/korea/cn.md

      - id: daum-and-kakao
        question:
          en: What happened to Daum, and does it still matter in Korea?
          cn: Daum 现在怎么样了？在韩国还重要吗？
        answer:
          en: |
            Daum was Korea's first portal and once its largest search
            engine. Kakao acquired it in 2014 and folded it into
            KakaoTalk; its share fell from roughly 20–30% around the
            merger to 1–3% now, and Bing passed it in July 2024. Kakao
            spun Daum off as AXZ in December 2025; Upstage acquired it on
            7 May 2026 and renamed it Daum Corporation in July 2026.

            What survives is not the search box but the placement inside
            KakaoTalk, which reaches 90–98% penetration in Korea — typing
            `#` in a chat returns Daum results. Treat KakaoTalk as a
            distribution channel, not an engine to optimize for.
          cn: |
            Daum 是韩国的第一个门户，也曾经是最大的搜索引擎。Kakao 在
            2014 年收购它并并进 KakaoTalk，份额从并购前后的 20%–30% 掉到
            今天的 1%–3%，2024 年 7 月被 Bing 反超。2025 年 12 月 Kakao
            把 Daum 分拆为 AXZ；Upstage 于 2026 年 5 月 7 日完成收购，
            7 月改名 Daum Corporation。

            活下来的是在 KakaoTalk 里的位置，而不是搜索框——在聊天里敲
            `#` 会返回 Daum 结果，而 KakaoTalk 在韩国渗透率 90%–98%。
            把它当分发渠道，而不是要优化的搜索引擎。
        confidence: 9
        reference:
          - docs/4-regional-markets/korea/en.md
          - docs/4-regional-markets/korea/cn.md

      - id: korea-priority-order
        question:
          en: I am launching in Korea. What is the priority order?
          cn: 我要在韩国上线，先后顺序该怎么排？
        answer:
          en: |
            Google first, always — it is still roughly half of outbound
            search traffic in Korea. Then add Bing, which at 5% costs
            almost nothing extra to cover via Bing Webmaster Tools and
            IndexNow. Then verify in Naver Search Advisor. Only then build
            inside Naver's own verticals: Blog for content reach, Place
            for local presence, Shopping for commerce, Knowledge iN where
            you genuinely have experts to answer from.

            Two cautions: Korean queries are sentences, so write the way a
            local asks; and a link from a Korean site is worth far more on
            Naver than the same link from abroad.
          cn: |
            永远先做 Google——它仍占韩国外跳搜索流量的近一半。然后加
            Bing，5% 的份额用 Bing 站长工具加 IndexNow 覆盖几乎不花成本。
            再在 Naver Search Advisor 完成验证。最后才进到 Naver 自己的
            垂类里做：博客拿内容触达，Place 做本地，Shopping 做电商，
            知识 iN 在你确实有专家能答的时候做。

            两个提醒：韩国查询是句子，按本地人的问法来写；Naver 上来自
            韩国站点的链接，价值远高于同样的国际链接。
        confidence: 8
        reference:
          - docs/4-regional-markets/korea/en.md
          - docs/4-regional-markets/korea/cn.md

      - id: korea-google-still-wins
        question:
          en: Where does Google still beat Naver in Korea?
          cn: 在韩国，Google 在哪些地方仍然赢过 Naver？
        answer:
          en: |
            Clearly, in predictable places: developer and technical
            queries (~95%), English and global content (~88%), video
            (~98%), academic search (~78%) and B2B SaaS review queries
            (~70%).

            It is weakest on Korean local commerce, at roughly 18%. The
            workable split is: English, technical, academic and video
            search stays Google's; Korean-language, local, consumer and
            commerce search is Naver's.
          cn: |
            在一些可预测的地方明显赢：开发者与技术类查询（约 95%）、英文
            与全球内容（约 88%）、视频（约 98%）、学术搜索（约 78%）、
            B2B SaaS 评测类（约 70%）。

            它在韩国本地购物上最弱，约 18%。可行的分工是：英文、技术、
            学术、视频搜索归 Google；韩语、本地、消费与购物搜索归 Naver。
        confidence: 8
        reference:
          - docs/4-regional-markets/korea/en.md
          - docs/4-regional-markets/korea/cn.md
