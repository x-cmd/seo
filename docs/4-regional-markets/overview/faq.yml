id: x-seo-overview

data:
  - name:
      en: overview
      cn: 概览
    qa:
      - id: do-i-need-more-than-google
        question:
          en: Do I need to optimize for a search engine other than Google?
          cn: 我需要做 Google 以外的搜索引擎吗？
        answer:
          en: |
            Usually not. Google takes about 90% of searches worldwide, so
            "just do Google" is right in most markets. You need a second
            strategy only where a local engine holds a real share — Russia
            (Yandex ~73%), Korea (Naver ~46–63%), Taiwan (Yahoo! ~13%),
            the Czech Republic (Seznam ~12%), Japan (Yahoo! ~9%) and
            Vietnam (Cốc Cốc ~4%).

            The decisive test is not "is it local" but "does it have an
            index I cannot borrow". If the engine merely re-serves
            Google results, your Google work already covers it.
          cn: |
            通常不需要。全球搜索约 90% 归 Google，所以在多数市场
            「只做 Google」是对的。只有本地引擎真能拿到份额的市场才需要
            第二套策略——俄罗斯（Yandex 约 73%）、韩国（Naver 约 46%–63%）、
            台湾（Yahoo! 约 13%）、捷克（Seznam 约 12%）、日本（Yahoo! 约 9%）
            和越南（Cốc Cốc 约 4%）。

            关键判断不是「它是不是本地的」，而是「它的索引你借不到吗」。
            如果它只是重新吐 Google 的结果，你的 Google 工作已经覆盖了它。
        confidence: 9
        reference:
          - docs/4-regional-markets/overview/en.md
          - docs/4-regional-markets/overview/cn.md

      - id: local-engine-shapes
        question:
          en: What kinds of local search engine are there, and do they all need separate SEO work?
          cn: 本地搜索引擎有哪几种形态？都要单独做 SEO 吗？
        answer:
          en: |
            Three shapes, with very different consequences:

            - **Independent index** — Naver, Seznam, Cốc Cốc, Yandex crawl
              and rank the web themselves. This is the only shape that needs
              a second SEO strategy, a second submission flow, and its own
              webmaster tool.
            - **Licensed wrapper** — Yahoo! JAPAN and Yahoo! Taiwan serve
              Google's index; Ecosia runs on Bing's. Your existing work
              largely carries over; what differs is presentation and
              verticals.
            - **Meta-search** — Startpage, MetaGer forward queries to other
              engines. Nearly free: you are already ranked there.
          cn: |
            三种形态，后果差别很大：

            - **自建索引**——Naver、Seznam、Cốc Cốc、Yandex 自己爬、自己排。
              这是唯一需要单独一套 SEO 策略、单独一套提交流程、单独一个
              站长工具的形态。
            - **授权套壳**——Yahoo! JAPAN 和 Yahoo 台湾用 Google 的索引，
              Ecosia 跑在 Bing 上。你已有的工作基本能带过去，差别在呈现
              和垂类生态。
            - **元搜索**——Startpage、MetaGer 把查询转发给别的引擎。
              几乎免费：你已经在那儿了。
        confidence: 9
        reference:
          - docs/4-regional-markets/overview/en.md
          - docs/4-regional-markets/overview/cn.md

      - id: why-market-share-numbers-disagree
        question:
          en: Why do different sources give different market share for the same country?
          cn: 为什么同一个市场，不同来源给出的份额不一样？
        answer:
          en: |
            Because they measure different things. StatCounter counts
            outbound referral clicks — the visits that actually leave the
            engine. InternetTrend counts queries, including ones answered
            entirely on the engine's own pages.

            Korea is where the gap is widest: Naver is 62.9% on query
            volume but 45.6% on referrals, because a Korean user can get a
            complete answer from Naver's own blog, cafe and Knowledge iN
            results without ever clicking through. Which number is right
            depends on whether you are measuring searches you could win or
            visitors you could get.
          cn: |
            因为量的不是同一件事。StatCounter 数的是外跳的引荐点击——真正
            离开引擎的访问。InternetTrend 数的是查询量，包括那些在引擎
            自己页面上就被回答完的。

            韩国差距最大：Naver 在查询量口径下 62.9%，在引荐口径下只有
            45.6%，因为韩国用户可能在 Naver 自己的博客、Cafe、知识 iN 里
            就拿到完整答案，一次都没点出来。哪个数字对，取决于你想量的是
            「能赢下多少搜索」还是「能拿到多少访客」。
        confidence: 9
        reference:
          - docs/4-regional-markets/overview/en.md
          - docs/4-regional-markets/overview/cn.md

      - id: bing-covers-many-markets
        question:
          en: One submission for many markets — does that work?
          cn: 一次提交能覆盖多个市场吗？
        answer:
          en: |
            For the Bing-family markets, yes. Bing's index also supplies
            Yahoo Search, DuckDuckGo and Ecosia, so a single Bing Webmaster
            Tools account, one sitemap, and IndexNow cover Germany, France,
            the Netherlands, Brazil, the Philippines, India, Indonesia and
            Thailand at once.

            The same trick works with IndexNow, which Bing, Yandex and
            Seznam all accept. It does not work for Naver, Cốc Cốc or
            Baidu, which run their own indexes and need their own
            webmaster tools.
          cn: |
            对 Bing 系的市场，可以。Bing 的索引同时供给 Yahoo Search、
            DuckDuckGo 和 Ecosia，所以一个 Bing 站长工具账号、一份 sitemap
            加上 IndexNow，可以一次覆盖德国、法国、荷兰、巴西、菲律宾、
            印度、印尼和泰国。

            IndexNow 也是同样的思路，Bing、Yandex、Seznam 都接受它。
            但对 Naver、Cốc Cốc、百度不管用——它们是自建索引，各有各的
            站长工具。
        confidence: 8
        reference:
          - docs/4-regional-markets/overview/en.md
          - docs/4-regional-markets/overview/cn.md

      - id: how-much-traffic-is-enough
        question:
          en: How much of my traffic does a country need to be worth a second strategy?
          cn: 一个国家要占我多少流量，才值得做第二套策略？
        answer:
          en: |
            A rough and useful threshold is 5% of sessions. Below that,
            a second engine's ceiling is too low to pay for the content,
            the links and the tooling it requires.

            Then check three things for that market: does the local engine
            have its own index (if not, Google covers it), does it have its
            own webmaster tool (if not, treat it as a satellite), and does
            it have its own vertical ecosystem (if so, budget for presence,
            not just ranking).
          cn: |
            一个粗略但好用的阈值是会话数的 5%。低于这个数，第二个引擎的
            天花板太低，撑不起它要求的内容、外链和工具成本。

            再对这个市场问三件事：本地引擎有没有自己的索引（没有的话
            Google 就覆盖了）、有没有自己的站长工具（没有就当跟班处理）、
            有没有自己的垂类生态（有的话要预算的是「出现」，不只是排名）。
        confidence: 8
        reference:
          - docs/4-regional-markets/overview/en.md
          - docs/4-regional-markets/overview/cn.md

      - id: privacy-engines-worth-it
        question:
          en: Are Ecosia, Startpage, Qwant and MetaGer worth optimizing for?
          cn: Ecosia、Startpage、Qwant、MetaGer 值得优化吗？
        answer:
          en: |
            Not on their own. They sit between 1% and 2% in Germany, France,
            the Netherlands and Austria — real enough to appear in a table,
            too small to justify a separate strategy.

            They matter for two other reasons: they show how strong the
            privacy conversation is in those markets, and two of them
            (Ecosia, and Qwant since it left Bing behind) run on an index
            you may already be covered on.
          cn: |
            单看不值得。 它们在德国、法国、荷兰、奥地利加起来占 1%–2%——
            真实存在，上得了表格，但小到撑不起一套独立策略。

            它们的意义在另外两点：一是标示那几个国家隐私议题的强度；
            二是其中两个（Ecosia，以及离开 Bing 之后的 Qwant）跑的索引
            你可能已经覆盖了。
        confidence: 8
        reference:
          - docs/4-regional-markets/overview/en.md
          - docs/4-regional-markets/overview/cn.md
