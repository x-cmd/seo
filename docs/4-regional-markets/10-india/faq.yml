data:
  - name:
      en: overview
      cn: 概览
    qa:
      - id: india-market-share
        question:
          en: What is India's search engine market share?
          cn: 印度搜索引擎的市场份额是多少？
        answer:
          en: |
            2025 full-year averages, all devices, from StatCounter: Google
            97.3%, Bing 1.3%, DuckDuckGo 0.7%, Yahoo! 0.5%. Nothing else
            above 1%.

            India is the purest Google market of its size — no local
            champion and no meaningful second engine. Its domestic
            internet winners (Flipkart, Zomato, Paytm) won as apps and
            portals, not as search engines.
          cn: |
            2025 全年平均、全设备，来源 StatCounter：Google 97.3%、
            Bing 1.3%、DuckDuckGo 0.7%、Yahoo! 0.5%，其余没有一个超过 1%。

            印度是同等体量里最纯粹的 Google 市场——没有本土霸主，也没有
            有意义的第二引擎。它的本土互联网赢家（Flipkart、Zomato、
            Paytm）是以应用和门户赢的，不是以搜索引擎。
        confidence: 9
        reference:
          - docs/4-regional-markets/10-india/en.md
          - docs/4-regional-markets/10-india/cn.md

      - id: india-language-strategy
        question:
          en: Which languages should an Indian site target?
          cn: 面向印度的站该做哪些语言？
        answer:
          en: |
            Decide explicitly, then use hreflang between versions. Three
            buckets: English (urban, professional, technical, commerce),
            Hindi (the largest and fastest-growing segment — video, news,
            government services, local commerce), and regional languages
            (Bengali, Telugu, Marathi, Tamil and more, each with tens of
            millions of speakers).

            Do not machine-translate — Indic-language users notice, and so
            does Google's page-quality evaluation. For transliterated
            queries (matlab as well as मतलब), carry the common Latin-script
            spellings in titles where it reads naturally.
          cn: |
            明确地决定，再在版本之间用 hreflang。三桶：英语（城市、职业、
            技术、商业）、印地语（最大且增长最快的段——视频、新闻、政务、
            本地商业）、各邦语言（孟加拉语、泰卢固语、马拉地语、泰米尔语
            等，每一种都有数千万使用者）。

            不要机翻——印度诸语言的用户看得出来，Google 的页面质量评估
            也看得出来。对转写查询（matlab 与 मतलब 同义），在自然可读的
            前提下让标题带上常见的拉丁拼法。
        confidence: 9
        reference:
          - docs/4-regional-markets/10-india/en.md
          - docs/4-regional-markets/10-india/cn.md

      - id: india-mobile-performance
        question:
          en: What performance bar matters in India?
          cn: 在印度，性能达标线是什么？
        answer:
          en: |
            A low-end Android phone on a slow connection, not a fast phone
            on wifi. For a large share of Indian users the phone is the
            only device, sometimes on a modest data plan. Every megabyte
            costs a share of the audience.

            Test Core Web Vitals on that hardware. AMP is no longer the
            answer — Google retired most of its search advantages — but
            the discipline it enforced, small and fast pages, is exactly
            right.
          cn: |
            低端安卓加慢连接，不是快手机加 WiFi。对很大一部分印度用户，
            手机是唯一设备，有时还配着不大的流量套餐。每一兆字节都在花掉
            一部分受众。

            在那样的硬件上测 Core Web Vitals。AMP 不再是答案——Google
            收回了它的大部分搜索优待——但它强制的那套纪律，小而快的页面，
            完全正确。
        confidence: 9
        reference:
          - docs/4-regional-markets/10-india/en.md
          - docs/4-regional-markets/10-india/cn.md

      - id: india-ai-overviews
        question:
          en: How are AI assistants changing Indian search?
          cn: AI 助手正在怎样改变印度搜索？
        answer:
          en: |
            Not by taking share from Google — by taking queries from
            search itself. AI Overviews roll out in India across English
            and Hindi; India is consistently one of ChatGPT's largest
            markets; and vernacular voice-first assistants reach users for
            whom typing was the barrier.

            For an optimizer: the position-zero surfaces are multiplying,
            being the cited source in an AI answer is worth more than a
            blue link at position two, and question-shaped answers in the
            opening of a page win both the voice layer and the AI layer.
          cn: |
            不是从 Google 手里抢份额——而是从搜索本身手里拿走查询。
            AI Overviews 在印度覆盖英语和印地语；印度一直是 ChatGPT 最大
            的市场之一；面向印度诸语言的语音优先助手则触达了那些一直被
            「打字」挡在外面的用户。

            对优化者：第零位的版面在变多；成为 AI 答案里被引用的那个来源，
            价值高于位置二的蓝链；在页面开头就给出问句式答案的内容，
            同时赢得语音层和 AI 层。
        confidence: 8
        reference:
          - docs/4-regional-markets/10-india/en.md
          - docs/4-regional-markets/10-india/cn.md
