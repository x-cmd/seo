id: x-seo-taiwan

data:
  - name:
      en: overview
      cn: 概览
    qa:
      - id: taiwan-market-share
        question:
          en: What is Taiwan's search engine market share?
          cn: 台湾搜索引擎的市场份额是多少？
        answer:
          en: |
            2025 full-year averages, all devices, from StatCounter: Google
            79.6%, Yahoo! Taiwan 13.3%, Bing 6.5%. Everything else is under
            0.5%.

            The device split matters: desktop is Google 65.7%, Yahoo!
            17.1%, Bing 16.7% — a real three-way contest — while mobile is
            87.6% Google. Bing is worth covering only if your Taiwanese
            traffic is desktop.
          cn: |
            2025 全年平均、全设备，来源 StatCounter：Google 79.6%、
            Yahoo! 台湾 13.3%、Bing 6.5%，其余都在 0.5% 以下。

            设备拆分更重要：桌面端是 Google 65.7%、Yahoo! 17.1%、
            Bing 16.7%——真正的三方竞争；移动端则是 Google 87.6%。
            只有当台湾流量在桌面端时，Bing 才值得覆盖。
        confidence: 9
        reference:
          - docs/4-regional-markets/4-taiwan/en.md
          - docs/4-regional-markets/4-taiwan/cn.md

      - id: taiwan-yahoo-uses-google
        question:
          en: Does Yahoo! Taiwan use Google's search results, like Yahoo! JAPAN?
          cn: Yahoo! 台湾和 Yahoo! JAPAN 一样用 Google 的结果吗？
        answer:
          en: |
            Yes — Yahoo! Taiwan serves organic results from Google's index,
            the same wrapper shape as Japan. So there is no Yahoo! Taiwan
            webmaster tool to submit to, no separate index to be found in,
            and no second link profile to build. Google work carries over.

            What differs is presentation: check how your titles and
            descriptions render in Yahoo! Taiwan's layout, the same
            title-tag discipline as in Japan.
          cn: |
            是的——Yahoo! 台湾的自然结果来自 Google 的索引，和日本同样的
            套壳形态。所以没有需要提交的 Yahoo! 台湾站长工具，没有独立的
            索引可以进，也不需要建第二套外链。Google 上的工作会带过去。

            不同的是呈现：检查标题和描述在 Yahoo! 台湾版式里怎么渲染，
            和日本一样是标题标签的功夫。
        confidence: 9
        reference:
          - docs/4-regional-markets/4-taiwan/en.md
          - docs/4-regional-markets/4-taiwan/cn.md

      - id: taiwan-traditional-vs-simplified
        question:
          en: Can I serve Simplified Chinese content to Taiwan, or convert it?
          cn: 台湾可以直接用简体内容或转换版吗？
        answer:
          en: |
            You can, and it will underperform. Traditional Chinese
            (zh-TW) and Simplified Chinese (zh-CN) are different queries,
            not variants of one query — a user searching 網路 wants pages
            written 網路, not 网络.

            Google's script conversion will match your Simplified page to
            a Traditional query, but the reader who lands on it notices
            immediately. Conversion is a fallback, not a strategy. Write
            in Traditional characters with Taiwan's own vocabulary —
            軟體 not 软件, 影片 not 视频 — in the title, description,
            body, alt text and structured data, and declare zh-TW.
          cn: |
            可以，但效果会差。繁体（zh-TW）和简体（zh-CN）是不同的查询，
            不是同一个查询的变体——搜「網路」的人要的是寫「網路」的頁面，
            不是写「网络」的。

            Google 的简繁转换会让你的简体页面匹配到繁体查询，但落上去的
            读者一眼就看出来。转换是兜底，不是策略。用繁体字和台湾自己的
            用词——軟體而非软件、影片而非视频——写进标题、描述、正文、
            alt 文本和结构化数据，并声明 zh-TW。
        confidence: 9
        reference:
          - docs/4-regional-markets/4-taiwan/en.md
          - docs/4-regional-markets/4-taiwan/cn.md

      - id: taiwan-baidu
        question:
          en: Should I optimize for Baidu to reach Taiwan?
          cn: 要覆盖台湾，需要做百度吗？
        answer:
          en: |
            No. Baidu's share in Taiwan is negligible, because it indexes
            the mainland web rather than Taiwan's. Baidu, Shenma and Sogou
            belong in a mainland-China strategy; for Taiwan the targets are
            Google (and its Yahoo! Taiwan wrapper) plus, for desktop
            traffic, Bing.
          cn: |
            不需要。百度在台湾的份额可以忽略，因为它索引的是大陆网络而非
            台湾的。百度、神马、搜狗属于大陆策略；对台湾来说，目标是
            Google（以及它的套壳 Yahoo! 台湾），桌面流量再加一个 Bing。
        confidence: 9
        reference:
          - docs/4-regional-markets/4-taiwan/en.md
          - docs/4-regional-markets/4-taiwan/cn.md

      - id: taiwan-local-surfaces
        question:
          en: What are the local-search surfaces in Taiwan?
          cn: 台湾的本地搜索入口有哪些？
        answer:
          en: |
            Google Business Profile and the map pack, working the same way
            as in the US, with citations kept consistent (name, address,
            phone) across Taiwanese business directories and review sites.

            The other half of Taiwanese digital life is LINE, which is far
            more dominant there than in most markets. A LINE Official
            Account is often a higher-leverage move for a Taiwanese
            business than another round of on-page work.
          cn: |
            Google 商家资料和地图包，运作方式与美国相同，并在台湾本地的
            商业目录和点评站里保持 citation（名称、地址、电话）一致。

            台湾数字生活的另一半是 LINE，它在台湾的主导程度远超多数市场。
            对台湾的生意来说，开一个 LINE 官方账号往往比再做一轮页面优化
            更划算。
        confidence: 8
        reference:
          - docs/4-regional-markets/4-taiwan/en.md
          - docs/4-regional-markets/4-taiwan/cn.md
