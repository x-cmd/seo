id: x-seo-6-baidu

data:
  - name:
      en: overview
      cn: 概览
    qa:
      - id: what-is-baidu
        question:
          en: What is Baidu?
          cn: 什么是百度？
        answer:
          en: The dominant Chinese-language search engine. ~75% of Chinese-language search market in 2026. Operates the Search Resource Platform (ziyuan.baidu.com) and its own product ecosystem (Tieba, Baike, Zhidao, Maps).
          cn: 中文搜索的龙头。2026 年占据中文搜索市场约 75%。运营搜索资源平台（ziyuan.baidu.com）与自有产品生态（贴吧、百科、知道、地图）。
        confidence: 9
        reference:
          - docs/6-baidu.en.md
          - docs/6-baidu.cn.md

      - id: how-to-optimize
        question:
          en: How do I optimize for Baidu?
          cn: 如何为百度优化？
        answer:
          en: ICP filing + Simplified Chinese content + Baidu Search Resource Platform + sitemap submission + auto-push JS + backlinks from Chinese .cn / .com.cn domains + presence in Tieba / Baike / Zhidao.
          cn: ICP 备案 + 简体中文内容 + 百度搜索资源平台 + sitemap 提交 + 自动推送 JS + 来自中国 .cn / .com.cn 域的反向链接 + 在贴吧 / 百科 / 知道上的存在。
        confidence: 9
        reference:
          - docs/6-baidu.en.md

  - name:
      en: icp filing
      cn: icp 备案
    qa:
      - id: what-is-icp
        question:
          en: What is ICP filing?
          cn: 什么是 ICP 备案？
        answer:
          en: A filing with China's Ministry of Industry and Information Technology (MIIT) required for sites hosted on mainland China servers. Done via your host provider (Aliyun, Tencent Cloud); takes 7-20 days.
          cn: 向中国工信部（MIIT）的备案，大陆服务器上的站点必需。通过主机商（阿里云、腾讯云）办理；7-20 天。
        confidence: 9
        reference:
          - docs/6-baidu.en.md

      - id: icp-needed-overseas
        question:
          en: Do I need ICP filing for overseas servers?
          cn: 海外服务器需要 ICP 备案吗？
        answer:
          en: No — ICP filing is required only for mainland China servers. Sites on Hong Kong / Singapore / US servers don't need ICP. Baidu still indexes them but they may have less competitive advantage.
          cn: 不 —— ICP 备案只对大陆服务器必需。香港 / 新加坡 / 美国服务器上的站点不需要 ICP。百度仍会收录，但竞争优势可能较小。
        confidence: 9
        reference:
          - docs/6-baidu.en.md

  - name:
      en: submission
      cn: 提交
    qa:
      - id: how-to-submit
        question:
          en: How do I submit URLs to Baidu?
          cn: 如何向百度提交 URL？
        answer:
          en: Four ways: (1) Submit XML sitemap via the Search Resource Platform; (2) Manual URL submission (max 20 URLs at a time); (3) API submission (1000 URLs/submit, 10 submits/day per site); (4) Auto-push JS snippet that pushes URLs to Baidu on every page view.
          cn: 四种方式：（1）通过搜索资源平台提交 XML sitemap；（2）手动 URL 提交（每次最多 20 个 URL）；（3）API 提交（每次提交 1000 URL，每站每天 10 次）；（4）自动推送 JS 代码段，每次页面访问时推送 URL 给百度。
        confidence: 9
        reference:
          - docs/6-baidu.en.md

      - id: auto-push-js
        question:
          en: What is Baidu's auto-push JS?
          cn: 什么是百度的自动推送 JS？
        answer:
          en: A JS snippet hosted at //push.zhanzhang.baidu.com/push.js. Embed in your page and every page view pushes the URL to Baidu's crawl queue. The easiest way to get fast indexing.
          cn: 一个 JS 代码段托管在 //push.zhanzhang.baidu.com/push.js。嵌入页面后，每次页面访问把 URL 推到百度的爬取队列。最快收录的最简单方式。
        confidence: 9
        reference:
          - docs/6-baidu.en.md

  - name:
      en: ranking differences
      cn: 排名差异
    qa:
      - id: baidu-vs-google
        question:
          en: How is Baidu SEO different from Google SEO?
          cn: 百度 SEO 与 Google SEO 有何不同？
        answer:
          en: Baidu requires ICP filing, weighs meta keywords + keyword density + domain age more than Google, ranks its own products (Tieba/Baike/Zhidao) higher, and indexes slower (1-4 weeks vs 1-7 days). Both agree on content quality, backlinks, HTTPS, mobile, structured data.
          cn: 百度需要 ICP 备案，比 Google 更看重 meta keywords + 关键词密度 + 域名年龄，给自有产品（贴吧/百科/知道）更高排名，收录更慢（1-4 周对比 1-7 天）。一致之处：内容质量、反向链接、HTTPS、移动、结构化数据。
        confidence: 8
        reference:
          - docs/6-baidu.en.md

      - id: english-vs-chinese
        question:
          en: Can I target Baidu with English content?
          cn: 我能用英文内容针对百度吗？
        answer:
          en: Bad idea — Baidu ranks Simplified Chinese content much higher than English. Translate to Simplified Chinese and use Simplified Chinese keywords.
          cn: 不好——百度给简体中文内容的排名远高于英文。翻译成简体中文，用简体中文关键词。
        confidence: 9
        reference:
          - docs/6-baidu.en.md

  - name:
      en: ai features
      cn: ai 功能
    qa:
      - id: ai-summary
        question:
          en: Does Baidu have an AI Overview equivalent?
          cn: 百度有 AI Overview 对应物吗？
        answer:
          en: Yes — Baidu AI 摘要 (AI Summary). Backed by Baidu Wenxin Yiyan (Ernie). Same pattern as Google AI Overviews / DuckDuckGo DuckAssist: cites sources; long-form first-hand Chinese content wins.
          cn: 有 —— 百度 AI 摘要。由百度文心一言驱动。模式与 Google AI Overviews / DuckDuckGo DuckAssist 一样：引用来源；长篇一手中文内容胜出。
        confidence: 8
        reference:
          - docs/6-baidu.en.md